# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
name: Squish
options:
  bundleIdPrefix: com.pravegm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team in Xcode > Signing & Capabilities
targets:
  Squish:
    type: application
    platform: iOS
    sources:
      - path: Squish
    info:
      path: Squish/Info.plist
      properties:
        CFBundleDisplayName: Squish
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Light   # VISUAL-TARGET §6.13: the studio stays bright in Dark Mode
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    # Game Center achievements (bible §11). Ignored by CI (CODE_SIGNING_ALLOWED=NO); needed for device builds.
    entitlements:
      path: Squish/Squish.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pravegm.squish
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SquishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquishTests
    dependencies:
      - target: Squish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squish:
    build:
      targets:
        Squish: all
        SquishTests: [test]
    test:
      targets:
        - SquishTests
