name: TestFlight

# Builds a signed Release of Squish with Xcode 27.1 on GitHub's Apple-silicon runner and uploads it to App Store
# Connect, where it appears in TestFlight (and can later be picked for App Review). The founder's Mac is Intel, which
# can't run Xcode 27, so this is how builds reach the iPhone Duo and the App Store.
#
# One-time setup (founder): docs/appstore/SUBMISSION.md §5 (CI route).
# Repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the .p8 text): an App Store Connect API team key with the Admin role,
#     so Xcode can create the signing certificate and profile itself (cloud-managed signing); the same secrets
#     asc.yml uses
#   APPLE_TEAM_ID: the 10-character Team ID (developer.apple.com → Account → Membership details)
# The app record for com.pravegm.squish must exist in App Store Connect first.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in the run summary)"
        type: string
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/appstore/SUBMISSION.md §5 (CI route)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (Release, signed by Xcode with the API key)
        run: |
          set -o pipefail
          # Build number: the run number, so every upload is unique (App Store Connect rejects repeats).
          xcodebuild archive \
            -project Squish.xcodeproj -scheme Squish -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squish.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee archive.log | grep -E "error:|warning: .*Squish/|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Check the privacy manifest is in the archive
        run: |
          APP="$RUNNER_TEMP/Squish.xcarchive/Products/Applications/Squish.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Squish.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT|uploaded" || true
          grep -qE "\*\* EXPORT SUCCEEDED \*\*|Upload succeeded|Uploaded" export.log

      - name: Summary
        if: success()
        run: |
          {
            echo "### Uploaded Squish build ${{ github.run_number }} to App Store Connect"
            echo "It shows up in TestFlight after Apple's processing (usually 10–30 min)."
            [ -n "${{ inputs.notes }}" ] && echo "" && echo "**What to test:** ${{ inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
