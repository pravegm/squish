name: TestFlight

# Builds a signed Release of Squish with Xcode 27.1 on GitHub's Apple-silicon runner and uploads it to App Store
# Connect, where it appears in TestFlight (and can later be picked for App Review). The founder's Mac is Intel, which
# can't run Xcode 27, so this is how builds reach the iPhone Duo and the App Store.
#
# One-time setup (founder): docs/appstore/SUBMISSION.md §5 (CI route).
# Repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the .p8 text): an App Store Connect API team key with the Admin role,
#     so Xcode can create the signing certificate and profile itself (cloud-managed signing); the same secrets
#     asc.yml uses
#   APPLE_TEAM_ID: the 10-character Team ID (developer.apple.com → Account → Membership details)
# The app record for com.pravegm.squish must exist in App Store Connect first.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in the run summary)"
        type: string
        default: ""
      check_only:
        description: "Build and App Store-sign locally, check the signature, but do NOT upload"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/appstore/SUBMISSION.md §5 (CI route)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (Release) without creating a development certificate
        # 26 Oct 2026: Brim's CI (same Apple account) failed with "Your account has reached the maximum number of
        # certificates": automatic signing on a fresh runner creates a new Apple Development certificate every run, and
        # this workflow did the same. So the archive is built unsigned; its entitlements (Game Center) are stamped on
        # with a local ad-hoc signature (no certificate involved); the export below then signs it for the App Store with
        # Apple's cloud-managed distribution certificate via the Admin API key. Same fix as pravegm/brim testflight.yml.
        run: |
          set -o pipefail
          # Build number: the run number, so every upload is unique (App Store Connect rejects repeats).
          xcodebuild archive \
            -project Squish.xcodeproj -scheme Squish -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squish.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E "error:|warning: .*Squish/|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
          APP="$RUNNER_TEMP/Squish.xcarchive/Products/Applications/Squish.app"
          codesign --force --sign - --timestamp=none --entitlements Squish/Squish.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -c "game-center" || true

      - name: Check the privacy manifest is in the archive
        run: |
          APP="$RUNNER_TEMP/Squish.xcarchive/Products/Applications/Squish.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          if [ "$BUILT" != "${{ github.run_number }}" ]; then
            echo "::error::The app's CFBundleVersion is '$BUILT', not the run number ${{ github.run_number }}: App Store Connect would reject or renumber the upload. Check project.yml info.properties."
            exit 1
          fi

      - name: Export locally and check the App Store signature
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportLocal.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Squish.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export-local.log | grep -E "error:|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export-local.log
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/local/*.ipa
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          codesign -d --entitlements :- "$APP" > ent.plist 2>/dev/null || true
          cat ent.plist
          if grep -q "com.apple.developer.game-center" ent.plist; then
            echo "Game Center entitlement: present"
          else
            echo "::error::Game Center entitlement missing from the App Store signature"
            exit 1
          fi

      - name: Upload to App Store Connect
        if: ${{ !inputs.check_only }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <!-- Keep our build number (the run number). Left on, Xcode renumbers the upload to Apple's next free number,
                 so run 7 arrived as 1.0 (6) and the summary named the wrong build. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Squish.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT|uploaded" || true
          grep -qE "\*\* EXPORT SUCCEEDED \*\*|Upload succeeded|Uploaded" export.log

      - name: Summary
        if: success() && !inputs.check_only
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded Squish build ${{ github.run_number }} to App Store Connect"
            echo "It shows up in TestFlight after Apple's processing (usually 10–30 min)."
            # An `if`, not `[ … ] && …`: with no notes the test fails and, as the block's last command, failed the step.
            if [ -n "$NOTES" ]; then
              echo ""
              echo "**What to test:** $NOTES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
