name: Duo fold screenshots

# Expensive (iOS 27.1 runtime is ~7.85 GB and the Duo simulator is heavy), so manual only, or called by store.yml
# (the full App Store set). How it works, costs and limitations: docs/DUO-CI.md
on:
  workflow_dispatch:
    inputs:
      angles:
        description: "Book pass hinge angles, flat (180) to folded, space-separated"
        type: string
        default: "180 150 120 100 90 75 60 45"
      objects:
        description: "Book pass objects (ObjectKind raw values); empty = skip the book pass"
        type: string
        default: "rubberDuck bubbleWrap glassBottle sodaCan"
      driver:
        description: "Hinge driver (auto = first that passes a probe)"
        type: choice
        options: [auto, hinge, duo-hinge, foldctl]
        default: auto
      storeshot_objects:
        description: "Objects that get the tabletop store-shot pass (hero, 112, pair, reveal); empty = none"
        type: string
        default: "rubberDuck glassBottle sodaCan egg cakeSlice"
      storeshot_shots:
        description: "Tabletop store shots: angles (must be in tabletop_angles), fail (hero + pair), reveal (close, reopen)"
        type: string
        default: "112,fail,reveal"
      tabletop_angles:
        description: "Tabletop pass hinge sweep, integers, flat to folded (the hero waits for the hold at 62)"
        type: string
        default: "150 112 90 75 62 45"
      book_storeshot_objects:
        description: "Objects that also get book-pose store shots in the first pass (E-check artefacts); empty = none"
        type: string
        default: "rubberDuck"
      storeshot_angles:
        description: "Book-pose store-shot angles (must also be in angles)"
        type: string
        default: "120 75"
      duo_ui:
        description: "Raw Duo UI frames for the store set: shelf settings cover; empty = none"
        type: string
        default: "shelf settings cover"
      storegrid_objects:
        description: "Variety grid objects (need a tabletop hero this run); empty = no grid"
        type: string
        default: "rubberDuck egg cakeSlice sodaCan"
      orient_fallback:
        description: "If the app can't rotate itself to portrait: none, or applescript (Simulator.app ⌘←, needs Accessibility)"
        type: choice
        options: [none, applescript]
        default: none
  workflow_call:
    inputs:
      angles: { type: string, default: "180 150 120 100 90 75 60 45" }
      objects: { type: string, default: "rubberDuck bubbleWrap glassBottle sodaCan" }
      driver: { type: string, default: auto }
      storeshot_objects: { type: string, default: "rubberDuck glassBottle sodaCan egg cakeSlice" }
      storeshot_shots: { type: string, default: "112,fail,reveal" }
      tabletop_angles: { type: string, default: "150 112 90 75 62 45" }
      book_storeshot_objects: { type: string, default: "rubberDuck" }
      storeshot_angles: { type: string, default: "120 75" }
      duo_ui: { type: string, default: "shelf settings cover" }
      storegrid_objects: { type: string, default: "rubberDuck egg cakeSlice sodaCan" }
      orient_fallback: { type: string, default: none }
      artifact_name: { type: string, default: duo-screens }

concurrency:
  group: duo-${{ github.ref }}-${{ inputs.artifact_name || 'duo-screens' }}
  cancel-in-progress: true

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      XCODE_APP: /Applications/Xcode_27.1.app          # symlink to Xcode_27.1_Release_Candidate.app (27A9275)
      RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-27-1
      DUO_TYPE_FALLBACK: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
      RUNTIME_DIR: /Users/runner/simruntime
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        id: xcode
        timeout-minutes: 8
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          xcrun simctl list runtimes
          df -h / | tail -1
          sysctl -n hw.memsize hw.ncpu
          # gtimeout wraps every long call below (no GNU timeout on macOS by default).
          command -v gtimeout >/dev/null || brew install coreutils

      - name: Check for an installed iOS 27.1 runtime
        id: rt
        timeout-minutes: 2
        run: |
          if xcrun simctl list runtimes -j | python3 -c "import json,sys,os; sys.exit(0 if any(r['identifier']==os.environ['RUNTIME_ID'] and r.get('isAvailable') for r in json.load(sys.stdin)['runtimes']) else 1)"; then
            echo "installed=true" >> "$GITHUB_OUTPUT"; echo "iOS 27.1 runtime already installed"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and install iOS 27.1 runtime
        if: steps.rt.outputs.installed != 'true'
        timeout-minutes: 30
        run: |
          # With Xcode 27.1 selected, `-downloadPlatform iOS` fetches and installs the 27.1 runtime directly
          # (~7.85 GB, ~2 min on the runner, run 39793239718). Apple's CDN sometimes fails the first try.
          installed() {
            xcrun simctl list runtimes -j | python3 -c "import json,sys,os; sys.exit(0 if any(r['identifier']==os.environ['RUNTIME_ID'] and r.get('isAvailable') for r in json.load(sys.stdin)['runtimes']) else 1)"
          }
          for attempt in 1 2 3; do
            echo "::group::download attempt $attempt"
            gtimeout 1500 xcodebuild -downloadPlatform iOS 2>&1 | grep -v "Downloading iOS" | tail -20 || true
            echo "::endgroup::"
            installed && break
            sleep 15
          done
          xcrun simctl list runtimes
          installed || { echo "::error::iOS 27.1 runtime not installed"; exit 1; }
          df -h / | tail -1

      - name: Create and boot the iPhone Duo
        id: sim
        timeout-minutes: 10
        run: |
          type=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next((d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']=='iPhone Duo'), ''))")
          type="${type:-$DUO_TYPE_FALLBACK}"
          echo "device type: $type"
          xcrun simctl list runtimes -j | python3 -c "import json,sys,os; [print('27.1 supports:', [d['name'] for d in r.get('supportedDeviceTypes', [])]) for r in json.load(sys.stdin)['runtimes'] if r['identifier']==os.environ['RUNTIME_ID']]"
          udid=$(xcrun simctl create "Squish Duo" "$type" "$RUNTIME_ID")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "UDID=$udid"
          # Boot now so the (slow, first-ever) boot of the new runtime overlaps the build. Boot with simctl,
          # not Device Hub: quitting Device Hub shuts down the simulators it booted.
          xcrun simctl boot "$udid"

      - name: Install hinge tools
        timeout-minutes: 10
        continue-on-error: true
        run: |
          gtimeout 300 brew install artemnovichkov/tap/hinge || echo "::warning::hinge install failed"
          # Fallback A: duo-fold-control's host CLI (CoreSimulator XPC).
          if gtimeout 60 git clone --depth 1 https://github.com/tosbaha/duo-fold-control "$HOME/duo-fold-control"; then
            (cd "$HOME/duo-fold-control/tools" && clang -fobjc-arc -framework Foundation -o duo-hinge duo-hinge.m) \
              || echo "::warning::duo-hinge build failed"
          fi
          # Fallback B: foldctl (CoreDevice). Compiles Swift during install.
          gtimeout 400 brew install tatsuz0u/tap/foldctl || echo "::warning::foldctl install failed"

      - name: Generate project
        timeout-minutes: 5
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the Duo
        timeout-minutes: 30
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          gtimeout 1700 xcodebuild build \
            -project Squish.xcodeproj -scheme Squish \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Squish/|\*\* " || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          # The app must be built against the 27.1 SDK or it runs letterboxed in compatibility mode.
          otool -l build/Build/Products/Debug-iphonesimulator/Squish.app/Squish | grep -A4 LC_BUILD_VERSION || true

      - name: Wait for boot and warm up the hinge helper
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          gtimeout 840 xcrun simctl bootstatus "$UDID" -b
          # First `hinge` call compiles its helper into ~/.cache/hinge.
          if command -v hinge >/dev/null; then gtimeout 120 hinge -d "$UDID" get || true; gtimeout 30 hinge -d "$UDID" posture || true; fi
          gtimeout 30 xcrun simctl io "$UDID" enumerate || true

      - name: Capture Duo screenshots
        timeout-minutes: 95
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          OBJECTS: ${{ inputs.objects }}
          ANGLES: ${{ inputs.angles }}
          HINGE_DRIVER: ${{ inputs.driver }}
          # Pass 2 (tabletop, portrait): written by the app and copied to duo-screens/<object>-storeshot-hero.png
          # (failure freeze + caption), -112.png, -pair.png (the before/after frame) and -reveal.png (closed, then
          # reopened), each with an -eye E-check twin; plus raw <object>-tabletop-closed.png (cover) and -reveal.png.
          STORESHOT_OBJECTS: ${{ inputs.storeshot_objects }}
          STORESHOT_SHOTS: ${{ inputs.storeshot_shots }}
          TABLETOP_ANGLES: ${{ inputs.tabletop_angles }}
          ORIENT_FALLBACK: ${{ inputs.orient_fallback }}
          # Pass 1 (book pose): duo-screens/<object>-book-storeshot-<angle>[-eye].png, E-check artefacts only.
          BOOK_STORESHOT_OBJECTS: ${{ inputs.book_storeshot_objects }}
          STORESHOT_ANGLES: ${{ inputs.storeshot_angles }}
          # Pass 3: raw duo-shelf / duo-settings / duo-cover-launch. Pass 4: duo-storeshot-grid.png (variety frame).
          DUO_UI: ${{ inputs.duo_ui }}
          STOREGRID_OBJECTS: ${{ inputs.storegrid_objects }}
          OUT: duo-screens
        run: bash ci/duo-screenshots.sh

      - name: Assemble the Duo App Store set
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        # duo-screens/store/duo-inner (2007 × 2853) and duo-outer (1398 × 2034), with MANIFEST.txt (FOLD-REVIEW-5 §5).
        run: |
          [[ -d duo-screens ]] || exit 0
          bash ci/store-set.sh duo-screens
          cat duo-screens/store/MANIFEST.txt || true

      - name: Simulator diagnostics
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p duo-screens/logs
          gtimeout 120 xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process == "Squish" OR subsystem CONTAINS "hinge" OR process == "SpringBoard"' \
            > duo-screens/logs/sim-system.txt 2>&1 || true
          xcrun simctl list devices > duo-screens/logs/devices.txt 2>&1 || true

      - name: Upload Duo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'duo-screens' }}
          path: |
            duo-screens/
            build.log
          if-no-files-found: ignore

      - name: Shut down simulator
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: xcrun simctl shutdown all || true
